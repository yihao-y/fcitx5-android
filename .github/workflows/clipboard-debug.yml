name: Clipboard Link Suggestions - Debug APK

on:
  workflow_dispatch:
  push:
    branches:
      - feature/clipboard-link-suggestions

permissions:
  contents: read

jobs:
  build-debug:
    runs-on: ubuntu-24.04
    steps:
      - name: Fetch source code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Android environment
        uses: android-actions/setup-android@v4

      - name: Install CMake
        run: sdkmanager --install "cmake;3.31.6"

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y extra-cmake-modules gettext

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build app and Rime Debug APKs
        run: ./gradlew :app:assembleDebug :plugin:rime:assembleDebug --stacktrace

      - name: Upload Debug APKs
        uses: actions/upload-artifact@v7
        with:
          name: fcitx5-clipboard-debug
          path: |
            app/build/outputs/apk/debug/*.apk
            plugin/rime/build/outputs/apk/debug/*.apk
          retention-days: 7
          if-no-files-found: error
